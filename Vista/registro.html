<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Registro de Asociados - MR CLUB</title>
    <style>
        body { background-color: #f8f9fa; }
        .titulo { color: #b37575; }
        .btn-primario { background-color: #b37575; color: black; }
        .btn-primario:hover { background-color: #995f5f; color: white; }
        .btn-secundario { background-color: #d4a8a8; color: #222; }
        .btn-secundario:hover { background-color: #b98888; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4 fw-bold titulo">Registro de Asociados</h2>
                        
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Documento de Identidad</label>
                                <input type="number" class="form-control" required placeholder="Ej: 1058354573">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Nombres</label>
                                    <input type="text" class="form-control" required placeholder="Nombres completos">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Apellidos</label>
                                    <input type="text" class="form-control" required placeholder="Apellidos completos">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Dirección de Residencia</label>
                                <input type="text" class="form-control" required placeholder="Ej: Cra 25 # 11-105">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Teléfono</label>
                                    <input type="tel" class="form-control" required placeholder="Ej: 3225817510">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Ciudad</label>
                                    <select class="form-select" required>
                                        <option value="">Seleccione una ciudad</option>
                                        <option>Duitama</option>
                                        <option>Sogamoso</option>
                                        <option>Tunja</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Correo Electrónico</label>
                                <input type="email" class="form-control" required placeholder="correo@ejemplo.com">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Género</label>
                                <div class="d-flex gap-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="genero" id="femenino" value="Femenino" required>
                                        <label class="form-check-label" for="femenino">Femenino</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="genero" id="masculino" value="Masculino">
                                        <label class="form-check-label" for="masculino">Masculino</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="genero" id="otro" value="Otro">
                                        <label class="form-check-label" for="otro">Otro</label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primario flex-grow-1">Guardar</button>
                                <button type="reset" class="btn btn-secundario flex-grow-1">Limpiar</button>
                            </div>
                        </form>

                        <div class="mt-4 text-center">
                            <a href="dashboard.html" class="text-decoration-none" style="color: #b37575;">← Volver al Panel</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
