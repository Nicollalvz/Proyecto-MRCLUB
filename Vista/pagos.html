<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Registro de Pagos - MR CLUB</title>
    <style>
        body { background-color: #f8f9fa; }
        .titulo { color: #b37575; }
        .btn-primario { background-color: #b37575; color: black; }
        .btn-primario:hover { background-color: #995f5f; color: white; }
        .btn-secundario { background-color: #d4a8a8; color: #222; }
        .btn-secundario:hover { background-color: #b98888; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4 fw-bold titulo">Registro de Pagos</h2>
                        
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Código del Préstamo</label>
                                <input type="text" class="form-control" required placeholder="Ej: PREST-001">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Número de Cuota</label>
                                <input type="number" class="form-control" min="1" required placeholder="Ej: 1 de 12">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Documento del Asociado</label>
                                <input type="number" class="form-control" required placeholder="Ej: 1058354573">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre del Asociado</label>
                                <input type="text" class="form-control" required placeholder="Nombre completo">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Valor del Abono ($)</label>
                                <input type="number" class="form-control" min="0" step="1000" required placeholder="Ej: 50000">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Fecha de Pago</label>
                                <input type="date" class="form-control" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Método de Pago</label>
                                <select class="form-select" required>
                                    <option value="">Seleccione el método</option>
                                    <option>Efectivo</option>
                                    <option>Transferencia Bancaria</option>
                                    <option>Consignación</option>
                                    <option>Deducción de nómina</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primario flex-grow-1">Guardar</button>
                                <button type="reset" class="btn btn-secundario flex-grow-1">Limpiar</button>
                            </div>
                        </form>

                        <div class="mt-4 text-center">
                            <a href="dashboard.html" class="text-decoration-none" style="color: #b37575;">← Volver al Panel</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
