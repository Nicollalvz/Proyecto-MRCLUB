<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR CLUB — Inicio de Sesión</title>
    <link rel="stylesheet" href="../Assets/CSS/estilos.css">
</head>
<body>
    <div class="contenedor-login">
        <h2>Inicio de Sesión</h2>
        <p class="subtitulo">Ingresa tus datos para acceder</p>

        <form id="formLogin" action="" method="POST">
            
            <div class="grupo-input">
                <label for="usuario">Usuario:</label>
                <input 
                    id="usuario" 
                    name="usuario"
                    type="text" 
                    required 
                    placeholder="Escribe tu nombre de usuario"
                    autocomplete="username">
            </div>

            <div class="grupo-input">
                <label for="contraseña">Contraseña:</label>
                <input 
                    id="contraseña" 
                    name="contraseña"
                    type="password" 
                    required 
                    placeholder="Escribe tu contraseña"
                    autocomplete="current-password">
            </div>

            <div class="opciones">
                <label class="recordar">
                    <input type="checkbox" name="recordar"> Recordarme
                </label>
                <a href="#" class="olvido">¿Olvidaste tu contraseña?</a>
            </div>

            <div class="grupo-botones">
                <button type="submit" class="btn-principal">Ingresar</button>
                <button type="reset" class="btn-secundario">Limpiar Formulario</button>
            </div>
            
        </form>
    </div>
</body>
</html>
