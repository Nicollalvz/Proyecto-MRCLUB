<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../Assets/CSS/estilos.css">

    <title>MR CLUB</title>
</head>

    <body>
        <div>
            <h2>Inicio de Sesión</h2>
            <form id="formLogin" action="../Modelos/login.php" method="POST">
                
                <div class="grupo-input">
                    <label>Email:</label>
                    <input id="email" name="email" type="text" required placeholder="Ingrese su email">
                </div>

                <div class="grupo-input">
                    <label>Contraseña:</label>
                    <input id="contraseña" name="contraseña" type="password" required placeholder="Ingrese su contraseña">
                </div>

                <div class="grupo-botones">
                    <button type="submit">Ingresar</button>
                    <button type="reset">Limpiar Formulario</button>
                </div>
                <p id="mensajeLogin" class="text-danger mt-3 mb-0" role="alert"></p>
                
            </form>
        </div>

    </body>
    <script src="../Controladores/login.js"></script>

</html>
