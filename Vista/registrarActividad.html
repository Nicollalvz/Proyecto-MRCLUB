<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Registro de Actividades - MR CLUB</title>
    <style>
        :root {
            --bs-body-font-family: "Times New Roman", Times, serif;
        }
        body { background-color: #f8f9fa; }
        .titulo { color: #b37575; }
        .btn-primario { background-color: #b37575; color: black; }
        .btn-primario:hover { background-color: #995f5f; color: white; }
        .btn-secundario { background-color: #d4a8a8; color: #222; }
        .btn-secundario:hover { background-color: #b98888; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4 fw-bold titulo">Registro de Actividades</h2>
                        
                        <form id="formActividad">
                            
                            <div class="mb-3">
                                <label for="nombreActividad" class="form-label fw-semibold">Nombre de la Actividad</label>
                                <input type="text" class="form-control" id="nombreActividad" name="nombreActividad" maxlength="100" required placeholder="Ej: Cena Anual del Club">
                            </div>

                            <div class="mb-3">
                                <label for="fechaEvento" class="form-label fw-semibold">Fecha del Evento</label>
                                <input type="date" class="form-control" id="fechaEvento" name="fechaEvento" required>
                            </div>

                            <div class="mb-3">
                                <label for="municipio" class="form-label fw-semibold">Municipio</label>
                                <input type="text" class="form-control" id="municipio" name="municipio" maxlength="50" required placeholder="Ej: Sogamoso">
                            </div>

                            <div class="mb-4">
                                <label for="totalRecaudado" class="form-label fw-semibold">Total Recaudado ($) <small class="text-muted fw-normal">(Opcional)</small></label>
                                <input type="number" class="form-control" id="totalRecaudado" name="totalRecaudado" min="0" step="0.01" placeholder="Ej: 8500000.00">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primario flex-grow-1">
                                    <i class="bi bi-save"></i> Guardar
                                </button>
                                <button type="reset" class="btn btn-secundario flex-grow-1">
                                    <i class="bi bi-eraser"></i> Limpiar
                                </button>
                            </div>
                        </form>

                        <div class="mt-4 text-center">
                            <a href="registroActividades.html" class="text-decoration-none" style="color: #b37575;">← Volver al Panel</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
