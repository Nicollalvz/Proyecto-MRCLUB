<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <title>MR CLUB</title>
    <style>
        body { 
            background-color: #f8f9fa; 
        }
        .titulo { 
            color: #b37575; 
        }
        .btn-primario { 
            background-color: #b37575; 
            color: black; 
        }
        .btn-primario:hover { 
            background-color: #995f5f; 
            color: white; 
        }
        .btn-secundario { 
            background-color: #d4a8a8; 
            color: #222; 
        }
        .btn-secundario:hover { 
            background-color: #b98888; 
        }
        .header-mr {
            background-color: #b37575;
            color: white;
            padding: 20px 30px;
        }
        .table-dark {
            --bs-table-bg: #b37575;
            --bs-table-border-color: #995f5f;
        }
        .btn-success {
            background-color: #6c9c6c;
            border-color: #6c9c6c;
        }
        .btn-success:hover {
            background-color: #5a855a;
            border-color: #5a855a;
        }
    </style>
</head>

<body>
    <header class="header-mr d-flex justify-content-between align-items-center gap-3">
        <h1 class="h3 mb-0 titulo">Actividades del club</h1>
        <a class="btn btn-secundario" href="dashboard.html">
            <i class="bi bi-arrow-left"></i>
            Volver al panel
        </a>
    </header>
    <main class="container py-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
            <p class="mb-0 text-muted">
                Consulta las actividades programadas y su información.
            </p>
            <div>
                <button id="nuevaActividad" class="btn btn-primario d-none" type="button">
                    <i class="bi bi-plus-lg"></i>
                    Nueva actividad
                </button>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Actividad</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Municipio</th>
                            <th scope="col">Total recaudado</th>
                            <th id="encabezadoAcciones" class="d-none" scope="col">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody id="listaActividades">
                        <tr>
                            <td colspan="5" class="text-center py-4">
                                Cargando actividades...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastActividad" class="toast align-items-center border-0" role="status"
            aria-live="polite" aria-atomic="true" style="background-color: #d4a8a8; color: #222;">
            <div class="d-flex">
                <div id="mensajeActividades" class="toast-body"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Cerrar"></button>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modalActividad" tabindex="-1" aria-labelledby="tituloModalActividad" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formActividad">
                    <div class="modal-header" style="background-color: #f3e8e8;">
                        <h2 class="modal-title fs-5 titulo" id="tituloModalActividad">
                            Nueva actividad
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="idActividad" />

                        <div class="mb-3">
                            <label for="nombreActividad" class="form-label">
                                Nombre de la actividad
                            </label>
                            <input type="text" class="form-control" id="nombreActividad" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="fechaEvento" class="form-label">Fecha del evento</label>
                            <input type="date" class="form-control" id="fechaEvento" required />
                        </div>

                        <div class="mb-3">
                            <label for="municipio" class="form-label">Municipio</label>
                            <input type="text" class="form-control" id="municipio" maxlength="50" required />
                        </div>

                        <div id="campoTotalRecaudado" class="mb-3 d-none">
                            <label for="totalRecaudado" class="form-label">
                                Total recaudado (opcional; completar al finalizar)
                            </label>
                            <input type="number" class="form-control" id="totalRecaudado" min="0" step="0.01"
                                placeholder="Ej .: 1500000.00" />
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secundario" data-bs-dismiss="modal">Cancelar</button>
                        <button id="guardarActividad" type="submit" class="btn btn-primario">Guardar actividad</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/actividades.js"></script>
</body>

</html>
