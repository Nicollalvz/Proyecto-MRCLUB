<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Registro de Actividades - MR CLUB</title>
    <style>
        body { background-color: #f8f9fa; }
        .titulo { color: #b37575; }
        .btn-primario { background-color: #b37575; color: black; }
        .btn-primario:hover { background-color: #995f5f; color: white; }
        .btn-secundario { background-color: #d4a8a8; color: #222; }
        .btn-secundario:hover { background-color: #b98888; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4 fw-bold titulo">Registro de Actividades</h2>
                        
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre de la Actividad</label>
                                <input type="text" class="form-control" required placeholder="Ej: Torneo de Fútbol">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Descripción</label>
                                <textarea class="form-control" rows="3" required placeholder="Breve descripción de la actividad..."></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Fecha</label>
                                    <input type="date" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Hora</label>
                                    <input type="time" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Lugar</label>
                                <input type="text" class="form-control" required placeholder="Ej: Cancha Principal - Duitama">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Municipio</label>
                                <select class="form-select" required>
                                    <option value="">Seleccione el municipio</option>
                                    <option>Duitama</option>
                                    <option>Sogamoso</option>
                                    <option>Tunja</option>
                                    <option>Paipa</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Total Recaudado ($)</label>
                                <input type="number" class="form-control" min="0" step="1000" required placeholder="Ej: 2000000">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Cupo Máximo de Participantes</label>
                                <input type="number" class="form-control" min="1" required placeholder="Ej: 50">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Estado</label>
                                <select class="form-select" required>
                                    <option value="">Seleccione el estado</option>
                                    <option>Activa</option>
                                    <option>En proceso</option>
                                    <option>Finalizada</option>
                                    <option>Suspendida</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primario flex-grow-1">Guardar</button>
                                <button type="reset" class="btn btn-secundario flex-grow-1">Limpiar</button>
                            </div>
                        </form>

                        <div class="mt-4 text-center">
                            <a href="dashboard.html" class="text-decoration-none" style="color: #b37575;">← Volver al Panel</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
